site_name: Pyfaro
site_description: The unified Python development toolchain, built with Rust.
site_url: https://pyfaro.dev/
repo_url: https://github.com/pyfaro/pyfaro
repo_name: pyfaro/pyfaro
edit_uri: edit/main/website/docs/
copyright: Pyfaro is licensed under the Apache License 2.0.
strict: true

theme:
  name: material
  custom_dir: overrides
  logo: assets/pyfaro-mark-dark.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pyfaro/pyfaro
    - icon: fontawesome/brands/rust
      link: https://crates.io/crates/pyfaro
    - icon: fontawesome/solid/comments
      link: https://github.com/pyfaro/pyfaro/discussions
      name: Pyfaro discussions

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - First steps: getting-started/first-steps.md
      - Features: getting-started/features.md
  - Commands:
      - commands/index.md
      - create: commands/create.md
      - init: commands/init.md
      - sync: commands/sync.md
      - add and remove: commands/add-remove.md
      - run: commands/run.md
      - dev: commands/dev.md
      - python: commands/python.md
      - tools: commands/tools.md
      - doctor: commands/doctor.md
      - completions: commands/completions.md
      - lint: commands/lint.md
      - fmt: commands/fmt.md
      - type: commands/type.md
      - check: commands/check.md
      - test: commands/test.md
      - build: commands/build.md
  - Workflows:
      - workflows/index.md
      - A new library: workflows/new-library.md
      - A new CLI: workflows/new-cli.md
      - A FastAPI app: workflows/fastapi.md
      - Adopt an existing project: workflows/adopt-existing-project.md
      - The quality gate: workflows/quality-gate.md
      - Continuous integration: workflows/continuous-integration.md
      - Python versions: workflows/python-versions.md
      - Troubleshooting: workflows/troubleshooting.md
  - Concepts:
      - concepts/index.md
      - How it works: concepts/how-it-works.md
      - Projects: concepts/projects.md
      - Environments and tools: concepts/environments-and-tools.md
      - Configuration: concepts/configuration.md
      - Exit codes: concepts/exit-codes.md
      - Security and privacy: concepts/security-and-privacy.md
      - Platform support: concepts/platform-support.md
  - Reference:
      - reference/index.md
      - Command line: reference/cli.md
      - Configuration: reference/configuration.md
      - Environment variables: reference/environment-variables.md
      - Tested versions: reference/tested-versions.md
      - Changelog: reference/changelog.md
