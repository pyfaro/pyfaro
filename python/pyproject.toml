[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "pyfaro"
description = "Experimental Python project workflows powered by uv"
readme = "../README.md"
license = "Apache-2.0"
license-files = ["LICENSE-APACHE"]
keywords = ["python", "uv", "cli", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Build Tools",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://pyfaro.dev/"
Documentation = "https://pyfaro.dev/"
Repository = "https://github.com/pyfaro/pyfaro"
Changelog = "https://github.com/pyfaro/pyfaro/blob/main/CHANGELOG.md"
Issues = "https://github.com/pyfaro/pyfaro/issues"

[tool.maturin]
bindings = "bin"
manifest-path = "../Cargo.toml"
strip = true
