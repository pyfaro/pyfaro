[package]
name = "pyfaro"
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.90"
description = "Experimental Python project workflows powered by uv"
license = "Apache-2.0"
repository = "https://github.com/pyfaro/pyfaro"
readme = "README.md"
documentation = "https://github.com/pyfaro/pyfaro#readme"
keywords = ["python", "uv", "cli", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = [
    "/src/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/SECURITY.md",
    "/docs/init.md",
    "/docs/sync.md",
    "/docs/run.md",
    "/docs/uv-adapter.md",
    "/docs/releasing.md",
    "/docs/architecture/0001-project-architecture.md",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.5"
semver = "1.0"
tempfile = "3.23"
thiserror = "2.0"
toml_edit = "0.23.7"
which = "8.0"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", features = ["signal", "process", "poll"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.31", features = ["signal", "process", "poll"] }
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-group"] }
rustix = { version = "1.1", features = ["process"] }

[target.'cfg(target_os = "windows")'.dependencies]
subc-jobobject = "0.2.1"

[target.'cfg(unix)'.dev-dependencies]
portable-pty = "0.9.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[[bin]]
name = "pyfaro"
path = "src/main.rs"
