name: Release

# Manual, gated publication of the version recorded in Cargo.toml. Leaving
# `publish` unchecked runs every check, packaging step, and binary and wheel
# build without uploading, tagging, or creating a GitHub Release. Nothing is
# uploaded until the crate archive, all five reproducible binary archives,
# and the PyPI wheels and sdist have been built and checked. The tag is
# created only after the verified crates.io upload, so a v<version> tag
# always means a published version; the GitHub Release and the PyPI upload
# follow it. See docs/releasing.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Cargo.toml version to release (for example 0.3.0-alpha.1)
        required: true
        type: string
      publish:
        description: Upload to crates.io and push the tag (unchecked is a dry run)
        type: boolean
        default: false
      github-release:
        description: Create a GitHub Release with binaries for the new tag
        type: boolean
        default: true
      pypi:
        description: Upload the wheels and sdist to PyPI after the tag
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pypi-version: ${{ steps.validate.outputs.pypi-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version, ref, tag, and registry
        id: validate
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
          PYPI: ${{ inputs.pypi }}
        run: |
          set -euo pipefail
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::Releases are cut from main, not $REF"
            exit 1
          fi
          manifest=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [ "$manifest" != "$VERSION" ]; then
            echo "::error::Input $VERSION does not match Cargo.toml $manifest"
            exit 1
          fi
          if ! grep -Eq "^## ${VERSION//./\\.}( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $VERSION' release section"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -A 'pyfaro-release (https://github.com/pyfaro/pyfaro)' \
            "https://crates.io/api/v1/crates/pyfaro/$VERSION")
          if [ "$status" != 404 ]; then
            echo "::error::crates.io returned HTTP $status for pyfaro $VERSION; it may already be published"
            exit 1
          fi
          pypi_version=$(python3 .github/scripts/release_artifacts.py pep440 "$VERSION")
          echo "pypi-version=$pypi_version" >> "$GITHUB_OUTPUT"
          if [ "$PYPI" = true ]; then
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              -A 'pyfaro-release (https://github.com/pyfaro/pyfaro)' \
              "https://pypi.org/pypi/pyfaro/$pypi_version/json")
            if [ "$status" != 404 ]; then
              echo "::error::PyPI returned HTTP $status for pyfaro $pypi_version; it may already be uploaded"
              exit 1
            fi
          fi

  checks:
    name: Checks
    needs: preflight
    uses: ./.github/workflows/ci.yml

  audit:
    name: Audit
    needs: preflight
    uses: ./.github/workflows/security.yml

  package:
    name: Package
    needs: [preflight, checks, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.90.0'
      - name: Install fixture Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install tested uv version
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.9.26'
          enable-cache: false
      - name: Build the crate archive
        run: cargo package --locked
      - name: Test the unpacked archive
        working-directory: target/package/pyfaro-${{ inputs.version }}
        run: cargo test --locked --all-targets
      - name: Verify publication without uploading
        run: cargo publish --dry-run --locked
      - name: Check the archive version and commit
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          python3 .github/scripts/release_artifacts.py check-crate \
            "target/package/pyfaro-$VERSION.crate" \
            --version "$VERSION" --commit "$COMMIT"
      - name: Record the archive checksum
        working-directory: target/package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sha256sum "pyfaro-$VERSION.crate" | tee "pyfaro-$VERSION.crate.sha256"
      - name: Keep the reviewed archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate
          path: |
            target/package/pyfaro-${{ inputs.version }}.crate
            target/package/pyfaro-${{ inputs.version }}.crate.sha256
          if-no-files-found: error

  binaries:
    name: Binaries
    needs: preflight
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: ${{ inputs.version }}

  wheels:
    name: Wheels
    needs: preflight
    uses: ./.github/workflows/build-wheels.yml
    with:
      version: ${{ inputs.version }}

  publish:
    name: Publish to crates.io
    needs: [package, binaries, wheels]
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Configure required reviewers on this environment so every upload needs
    # explicit maintainer approval, and register it as the crates.io trusted
    # publisher for this workflow.
    environment:
      name: crates-io
      url: https://crates.io/crates/pyfaro/${{ inputs.version }}
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.90.0'
      - name: Download the reviewed archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crate
          path: reviewed
      - name: Authenticate with crates.io trusted publishing
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
      - name: Compare the registry checksum with the reviewed archive
        run: |
          set -euo pipefail
          reviewed=$(cut -d' ' -f1 "reviewed/pyfaro-$VERSION.crate.sha256")
          uploaded=$(sha256sum "target/package/pyfaro-$VERSION.crate" | cut -d' ' -f1)
          registry=$(curl -sS --fail -A 'pyfaro-release (https://github.com/pyfaro/pyfaro)' \
            "https://crates.io/api/v1/crates/pyfaro/$VERSION" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"]["checksum"])')
          echo "reviewed=$reviewed uploaded=$uploaded registry=$registry"
          if [ "$reviewed" != "$uploaded" ] || [ "$uploaded" != "$registry" ]; then
            echo "::error::Published archive differs from the reviewed archive"
            exit 1
          fi
      - name: Tag the published commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/$REPOSITORY/git/tags" \
            -f tag="v$VERSION" -f message="pyfaro $VERSION" \
            -f object="$COMMIT" -f type=commit --jq .sha)
          gh api "repos/$REPOSITORY/git/refs" \
            -f ref="refs/tags/v$VERSION" -f sha="$tag" >/dev/null
          echo "Tagged $COMMIT as v$VERSION"

  github-release:
    name: GitHub Release
    needs: publish
    if: inputs.github-release
    # The called workflow splits these across two jobs: attestations get
    # `id-token` and `attestations`, the release itself gets `contents`.
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/github-release.yml
    with:
      tag: v${{ inputs.version }}
      prebuilt: true
      pypi: ${{ inputs.pypi }}

  # PyPI never accepts a file twice, so recover from a failure here by
  # re-running this job from the run page (see docs/releasing.md).
  pypi:
    name: Publish to PyPI
    needs: [preflight, publish]
    if: inputs.pypi
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Register this workflow and environment as the PyPI trusted publisher
    # of `pyfaro`, and configure required reviewers on the environment.
    environment:
      name: pypi
      url: https://pypi.org/project/pyfaro/${{ needs.preflight.outputs.pypi-version }}/
    permissions:
      id-token: write
    env:
      PYPI_VERSION: ${{ needs.preflight.outputs.pypi-version }}
    steps:
      - name: Download the verified wheels and sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist
      - name: Upload with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          # A re-run skips files a failed attempt already uploaded; the next
          # step proves PyPI holds exactly the reviewed bytes.
          skip-existing: true
      - name: Compare PyPI with the reviewed files
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -sS --fail -A 'pyfaro-release (https://github.com/pyfaro/pyfaro)' \
              -o pypi.json "https://pypi.org/pypi/pyfaro/$PYPI_VERSION/json"; then
              break
            fi
            if [ "$attempt" = 6 ]; then
              echo "::error::PyPI does not list pyfaro $PYPI_VERSION"
              exit 1
            fi
            sleep 10
          done
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          listed = {u["filename"]: u["digests"]["sha256"]
                    for u in json.load(open("pypi.json"))["urls"]}
          # The publish action leaves `*.publish.attestation` files beside
          # the distributions; only the distributions are on PyPI's list.
          local = {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                   for p in pathlib.Path("dist").iterdir()
                   if p.name.endswith((".whl", ".tar.gz"))}
          for name in sorted(set(local) | set(listed)):
              print(f"{name}: reviewed={local.get(name)} pypi={listed.get(name)}")
          if local != listed:
              sys.exit("::error::PyPI differs from the reviewed distributions")
          PY

  verify-pypi:
    name: Install from PyPI
    needs: [preflight, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Install and check the published version
        env:
          VERSION: ${{ inputs.version }}
          PYPI_VERSION: ${{ needs.preflight.outputs.pypi-version }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/pyfaro"
          for attempt in 1 2 3 4 5 6; do
            if "$RUNNER_TEMP/pyfaro/bin/python" -m pip install --disable-pip-version-check \
              --only-binary :all: --no-cache-dir "pyfaro==$PYPI_VERSION"; then
              break
            fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 20
          done
          test "$("$RUNNER_TEMP/pyfaro/bin/pyfaro" --version)" = "pyfaro $VERSION"

  verify-install:
    name: Install from crates.io
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.90.0'
      - name: Install and check the published version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cargo install pyfaro --version "$VERSION" --locked --root "$RUNNER_TEMP/pyfaro"
          test "$("$RUNNER_TEMP/pyfaro/bin/pyfaro" --version)" = "pyfaro $VERSION"
