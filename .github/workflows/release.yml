name: Release

# Manual, gated publication of the version recorded in Cargo.toml. Leaving
# `publish` unchecked runs every check and packaging step without uploading,
# tagging, or creating a GitHub Release. See docs/releasing.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Cargo.toml version to release (for example 0.3.0-alpha.1)
        required: true
        type: string
      publish:
        description: Upload to crates.io and push the tag (unchecked is a dry run)
        type: boolean
        default: false
      github-release:
        description: Create a GitHub Release with binaries for the new tag
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version, ref, tag, and registry
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::Releases are cut from main, not $REF"
            exit 1
          fi
          manifest=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [ "$manifest" != "$VERSION" ]; then
            echo "::error::Input $VERSION does not match Cargo.toml $manifest"
            exit 1
          fi
          if ! grep -Eq "^## ${VERSION//./\\.}( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $VERSION' release section"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -A 'pyfaro-release (https://github.com/pyfaro/pyfaro)' \
            "https://crates.io/api/v1/crates/pyfaro/$VERSION")
          if [ "$status" != 404 ]; then
            echo "::error::crates.io returned HTTP $status for pyfaro $VERSION; it may already be published"
            exit 1
          fi

  checks:
    name: Checks
    needs: preflight
    uses: ./.github/workflows/ci.yml

  audit:
    name: Audit
    needs: preflight
    uses: ./.github/workflows/security.yml

  package:
    name: Package
    needs: [preflight, checks, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.90.0'
      - name: Install fixture Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install tested uv version
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.26'
          enable-cache: false
      - name: Build the crate archive
        run: cargo package --locked
      - name: Test the unpacked archive
        working-directory: target/package/pyfaro-${{ inputs.version }}
        run: cargo test --locked --all-targets
      - name: Verify publication without uploading
        run: cargo publish --dry-run --locked
      - name: Record the archive checksum
        working-directory: target/package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sha256sum "pyfaro-$VERSION.crate" | tee "pyfaro-$VERSION.crate.sha256"
      - name: Keep the reviewed archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate
          path: |
            target/package/pyfaro-${{ inputs.version }}.crate
            target/package/pyfaro-${{ inputs.version }}.crate.sha256
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs: package
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Configure required reviewers on this environment so every upload needs
    # explicit maintainer approval, and register it as the crates.io trusted
    # publisher for this workflow.
    environment:
      name: crates-io
      url: https://crates.io/crates/pyfaro/${{ inputs.version }}
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.90.0'
      - name: Download the reviewed archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crate
          path: reviewed
      - name: Authenticate with crates.io trusted publishing
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
      - name: Compare the registry checksum with the reviewed archive
        run: |
          set -euo pipefail
          reviewed=$(cut -d' ' -f1 "reviewed/pyfaro-$VERSION.crate.sha256")
          uploaded=$(sha256sum "target/package/pyfaro-$VERSION.crate" | cut -d' ' -f1)
          registry=$(curl -sS --fail -A 'pyfaro-release (https://github.com/pyfaro/pyfaro)' \
            "https://crates.io/api/v1/crates/pyfaro/$VERSION" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"]["checksum"])')
          echo "reviewed=$reviewed uploaded=$uploaded registry=$registry"
          if [ "$reviewed" != "$uploaded" ] || [ "$uploaded" != "$registry" ]; then
            echo "::error::Published archive differs from the reviewed archive"
            exit 1
          fi
      - name: Tag the published commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/$REPOSITORY/git/tags" \
            -f tag="v$VERSION" -f message="pyfaro $VERSION" \
            -f object="$COMMIT" -f type=commit --jq .sha)
          gh api "repos/$REPOSITORY/git/refs" \
            -f ref="refs/tags/v$VERSION" -f sha="$tag" >/dev/null
          echo "Tagged $COMMIT as v$VERSION"

  github-release:
    name: GitHub Release
    needs: publish
    if: inputs.github-release
    permissions:
      contents: write
    uses: ./.github/workflows/github-release.yml
    with:
      tag: v${{ inputs.version }}

  verify-install:
    name: Install from crates.io
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.90.0'
      - name: Install and check the published version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cargo install pyfaro --version "$VERSION" --locked --root "$RUNNER_TEMP/pyfaro"
          test "$("$RUNNER_TEMP/pyfaro/bin/pyfaro" --version)" = "pyfaro $VERSION"
