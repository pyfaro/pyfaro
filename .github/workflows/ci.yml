name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - name: Install fixture Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install tested uv version
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.9.26'
          enable-cache: false
      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-1.90.0-${{ hashFiles('Cargo.lock') }}
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets
      - name: Debug build
        run: cargo build --locked
      - name: Release build
        run: cargo build --locked --release
      - name: CLI help
        run: cargo run --locked -- --help
      - name: CLI version
        run: cargo run --locked -- --version
      - name: Verify crate packaging
        run: cargo package --locked
      - name: Verify publication without uploading
        run: cargo publish --dry-run --locked
  e2e:
    name: E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: '1.90.0'
      - name: Install fixture Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install tested uv version
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.9.26'
          enable-cache: false
      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-1.90.0-${{ hashFiles('Cargo.lock') }}
      - name: Install zsh and fish for the completion tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish
      - name: Install fish for the completion tests
        if: runner.os == 'macOS'
        run: brew install fish
      - name: End-to-end tests
        env:
          PYFARO_E2E: '1'
        run: cargo test --locked --test e2e -- --nocapture
  install-scripts:
    name: Install scripts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck (POSIX sh)
        if: runner.os == 'Linux'
        run: shellcheck --shell=sh website/docs/install.sh tools/install-tests/test-install-sh.sh
      - name: install.sh under sh
        if: runner.os != 'Windows'
        run: sh tools/install-tests/test-install-sh.sh sh
      - name: install.sh under bash
        if: runner.os != 'Windows'
        run: bash tools/install-tests/test-install-sh.sh bash
      - name: install.ps1 under Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tools/install-tests/test-install-ps1.ps1
      - name: install.ps1 under PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/install-tests/test-install-ps1.ps1
  backlog:
    name: Backlog manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate manifest and importer
        run: |
          python3 tools/github-backlog/import_github.py --repo pyfaro/pyfaro
          python3 -m unittest discover -s tools/github-backlog -p 'test_*.py'
